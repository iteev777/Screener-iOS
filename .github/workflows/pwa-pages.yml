name: Publish Screener PWA to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      license_reviewed:
        description: I have confirmed that this deployment is permitted by the original license
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: screener-pwa-pages
  cancel-in-progress: false

jobs:
  build:
    if: inputs.license_reviewed && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Test and build the static app
        run: |
          rustup target add wasm32-unknown-unknown
          rustc --edition 2021 --test pwa/engine.rs -o "$RUNNER_TEMP/screener-tests"
          "$RUNNER_TEMP/screener-tests"
          bash pwa/package-static.sh "$RUNNER_TEMP/screener-pages"
          node --test pwa/*.test.mjs
          cmp LICENSE "$RUNNER_TEMP/screener-pages/LICENSE"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/screener-pages
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
