name: Build static Screener PWA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install browser WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Verify Rust strategy and package static app
        run: |
          rustc --edition 2021 --test pwa/engine.rs -o "$RUNNER_TEMP/screener-engine-tests"
          "$RUNNER_TEMP/screener-engine-tests"
          bash pwa/package-static.sh "$RUNNER_TEMP/screener-pwa"
          node --test pwa/*.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screener-pwa
          path: ${{ runner.temp }}/screener-pwa/
          include-hidden-files: true
          if-no-files-found: error
